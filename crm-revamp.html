  <style>
  .slideshow-container {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mySlides {
    display: none;
    width: 100%;
    height: 100%;
    padding: 3rem 6rem;
    box-sizing: border-box;
  }
  .mySlides img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    padding: 20px;
    color: var(--black);
    font-weight: bold;
    font-size: 36px;
    transition: opacity 0.3s ease;
    user-select: none;
    z-index: 100;
    opacity: 0.3;
  }
  .next { right: 1.5rem; }
  .prev { left: 1.5rem; }
  .prev:hover, .next:hover { opacity: 1; }
  .dot-container {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
  }
  .dot {
    cursor: pointer;
    height: 8px;
    width: 8px;
    background-color: var(--gray-300);
    border-radius: 50%;
    display: inline-block;
    transition: all 0.3s ease;
  }
  .dot.active { background-color: var(--black); transform: scale(1.4); }
  .dot.small { transform: scale(0.7); opacity: 0.6; }
  .fade { animation: fade 0.3s; }
  .brief-link {
    position: absolute;
    bottom: 4.75rem;
    left: 50%;
    transform: translateX(-50%);
    color: #2563eb;
    font-size: 0.9rem;
    font-weight: 500;
    text-decoration: none;
    z-index: 110;
    transition: opacity 0.2s ease;
  }
  .brief-link:hover {
    text-decoration: underline;
    text-underline-offset: 3px;
    opacity: 0.8;
  }
  @keyframes fade { from {opacity: .5} to {opacity: 1} }
  @media (max-width: 768px) {
    .mySlides { padding: 1rem 3rem; }
    .prev, .next { font-size: 24px; padding: 10px; }
    .next { right: 0.5rem; }
    .prev { left: 0.5rem; }
    .dot-container { bottom: 1rem; }
    .brief-link { bottom: 3rem; }
  }
</style>

  <script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) { showSlides(slideIndex += n); }
    function currentSlide(n) { showSlides(slideIndex = n); }

    function showSlides(n) {
      const slides = document.getElementsByClassName("mySlides");
      const dotContainer = document.getElementById("dotContainer");
      if (n > slides.length) slideIndex = 1;
      if (n < 1) slideIndex = slides.length;

      for (let i = 0; i < slides.length; i++) slides[i].style.display = "none";
      slides[slideIndex - 1].style.display = "block";

      const totalSlides = slides.length;
      let startDot = Math.max(1, slideIndex - 2);
      let endDot = Math.min(totalSlides, startDot + 4);
      if (endDot - startDot < 4) startDot = Math.max(1, endDot - 4);

      let dotsHTML = "";
      for (let j = startDot; j <= endDot; j++) {
        const active = j === slideIndex ? " active" : "";
        const small = j !== slideIndex && Math.abs(j - slideIndex) >= 2 ? " small" : "";
        dotsHTML += `<span class="dot${active}${small}" onclick="currentSlide(${j})"></span>`;
      }
      dotContainer.innerHTML = dotsHTML;
    }

    document.addEventListener("keydown", function(e) {
      if (e.key === "ArrowLeft") plusSlides(-1);
      else if (e.key === "ArrowRight") plusSlides(1);
      else if (e.key === "Escape" || e.key === "Backspace") window.location.href = "index.html#works";
    });
  </script>

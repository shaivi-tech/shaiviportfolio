  <style>
    /* Fullscreen Slideshow Layout */
    body {
      background-color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrolling, true presentation mode */
    }

    .slideshow-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mySlides {
      display: none;
      width: 100%;
      height: 100%;
      padding: 3rem 6rem; /* Padding prevents image from hitting arrows */
      box-sizing: border-box;
    }

    .mySlides img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* Scales image beautifully without cropping */
      display: block;
    }

    /* Navigation Arrows */
    .prev, .next {
      cursor: pointer;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 20px;
      color: var(--black);
      font-weight: bold;
      font-size: 36px;
      transition: opacity 0.3s ease;
      user-select: none;
      z-index: 100;
      opacity: 0.3;
    }

    .next { right: 1.5rem; }
    .prev { left: 1.5rem; }

    .prev:hover, .next:hover {
      opacity: 1;
    }

    /* Dynamic Dots Container */
    .dot-container {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 100;
    }

    .dot {
      cursor: pointer;
      height: 8px;
      width: 8px;
      background-color: var(--gray-300);
      border-radius: 50%;
      display: inline-block;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dot.active {
      background-color: var(--black);
      transform: scale(1.4);
    }
    
    .dot.small {
      transform: scale(0.7);
      opacity: 0.6;
    }

    .fade {
      animation-name: fade;
      animation-duration: 0.3s;
    }

    .brief-link {
      position: absolute;
      bottom: 5rem;
      left: 50%;
      transform: translateX(-50%);
      color: #2563eb;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      z-index: 110;
    }
    .brief-link:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @keyframes fade {
      from {opacity: .5} 
      to {opacity: 1}
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .mySlides { padding: 1rem 3rem; }
      .prev, .next { font-size: 24px; padding: 10px; }
      .next { right: 0.5rem; }
      .prev { left: 0.5rem; }
      .dot-container { bottom: 1rem; }
    }
  </style>
</head>

    <!-- Controls -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <!-- Dynamic Dots -->
    <div class="dot-container" id="dotContainer"></div>
  </div>

  <script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
      showSlides(slideIndex += n);
    }

    function currentSlide(n) {
      showSlides(slideIndex = n);
    }

    function showSlides(n) {
      let i;
      let slides = document.getElementsByClassName("mySlides");
      let dotContainer = document.getElementById("dotContainer");
      if (n > slides.length) {slideIndex = 1}    
      if (n < 1) {slideIndex = slides.length}
      for (i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";  
      }
      slides[slideIndex-1].style.display = "block";  
      
      // Render dynamic dots (max 5)
      let totalSlides = slides.length;
      let startDot = Math.max(1, slideIndex - 2);
      let endDot = Math.min(totalSlides, startDot + 4);
      
      // Adjust start if we hit the end
      if (endDot - startDot < 4) {
        startDot = Math.max(1, endDot - 4);
      }
      
      let dotsHTML = "";
      for (let j = startDot; j <= endDot; j++) {
        let isAct = (j === slideIndex) ? " active" : "";
        let isSmall = (j !== slideIndex && Math.abs(j - slideIndex) >= 2) ? " small" : "";
        dotsHTML += `<span class="dot${isAct}${isSmall}" onclick="currentSlide(${j})"></span>`;
      }
      dotContainer.innerHTML = dotsHTML;
    }

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        plusSlides(-1);
      } else if (e.key === 'ArrowRight') {
        plusSlides(1);
      } else if (e.key === 'Escape' || e.key === 'Backspace') {
        // Simple way to go back to works if they press ESC
        window.location.href = 'index.html#works';
      }
    });
  </script>
